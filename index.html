<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Conjugaison Française</title>

<link rel="stylesheet" href="styles.css">

</head>
<body>

<h1>Conjugaison Française</h1>

<div id="homeScreen">

    <div class="card">

        <div class="menu">

            <button id="mixedMode" class="primary">
                🎲 Pratique mixte
            </button>

            <button id="difficultMode">
                🔥 Réviser mes verbes difficiles
            </button>

        </div>

        <div class="stats">

            <strong>Progression</strong>

            <p>
                Cartes étudiées :
                <span id="cardsStudied">0</span>
            </p>

            <p>
                Cartes difficiles :
                <span id="hardCount">0</span>
            </p>
            <p>
                Cartes maîtrisées :
                <span id="knownCount">0</span>
            </p>


        </div>

    </div>

</div>

<div id="practiceScreen" class="hidden">

    <div class="card">

        <div>Conjuguez le verbe :</div>

        <div id="verb" class="verb"></div>

        <div id="subject" class="subject"></div>

        <input id="answer">

        <br><br>

        <button id="checkBtn" class="primary">
            Vérifier
        </button>

        <button id="knowBtn">
            ✅ Facile
        </button>

        <button id="hardBtn">
            Difficile
        </button>

        <button id="whyBtn">
            Pourquoi ?
        </button>

        <button id="nextBtn">
            Carte suivante
        </button>

        <div id="feedback"></div>

        <div id="correctAnswer"></div>

        <div id="explanation"></div>
    </div>

</div>

<script src="app.js"></script>
 
</body>
</html>
